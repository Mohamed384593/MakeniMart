<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful - MakeniMart</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .success-container {

            max-width: 600px;

            margin: 80px auto;

            padding: 40px 20px;

            text-align: center;

        }


        .success-card {

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.1);

        }


        .success-icon {

            font-size: 70px;

            margin-bottom: 20px;

        }


        .success-card h1 {

            color: #198754;

            margin-bottom: 15px;

        }


        .success-card p {

            font-size: 18px;

            color: #555;

            line-height: 1.6;

        }


        .success-buttons {

            margin-top: 30px;

            display: flex;

            gap: 15px;

            justify-content: center;

            flex-wrap: wrap;

        }


        .success-buttons a {

            display: inline-block;

            padding: 12px 22px;

            text-decoration: none;

            border-radius: 6px;

            background: #0d6efd;

            color: white;

        }


        .success-buttons a:hover {

            opacity: 0.9;

        }

    </style>

</head>


<body>


<!-- Navigation -->

<header>

    <nav class="navbar">

        <div class="logo">
            MakeniMart
        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- Success -->

<main>

    <div class="success-container">

        <div class="success-card">


            <div class="success-icon">
                ✅
            </div>


            <h1>
                Order Placed Successfully!
            </h1>


            <p>
                Thank you for shopping with
                MakeniMart.
            </p>


            <p>
                Your order has been received
                and is being processed.
            </p>


            <div class="success-buttons">

                <a href="products.html">
                    Continue Shopping
                </a>


                <a href="index.html">
                    Back to Home
                </a>

            </div>


        </div>

    </div>

</main>


</body>

</html>
