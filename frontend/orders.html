<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders - MakeniMart</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            background: #0d6efd;
            color: white;
            padding: 15px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            flex-wrap: wrap;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
            padding: 0;
            margin: 0;
            flex-wrap: wrap;
        }

        .nav-links li {
            display: inline-block;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 25px 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-top: 0;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            display: none;
            padding: 14px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
            text-align: center;
        }

        #message.success {
            display: block;
            background: #d1e7dd;
            color: #0f5132;
        }

        #message.error {
            display: block;
            background: #f8d7da;
            color: #842029;
        }

        /* =========================
           ORDERS
        ========================= */

        #ordersContainer {
            margin-top: 20px;
        }

        .order-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 10px;
            flex-wrap: wrap;

            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .order-number {
            font-size: 20px;
            font-weight: bold;
        }

        .status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status.Pending {
            background: #fff3cd;
            color: #664d03;
        }

        .status.Processing {
            background: #cff4fc;
            color: #055160;
        }

        .status.Delivered {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status.Cancelled {
            background: #f8d7da;
            color: #842029;
        }

        .order-info {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );

            gap: 10px;

            margin-bottom: 20px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
        }

        .info-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: bold;
        }

        /* =========================
           ITEMS
        ========================= */

        .items-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;

            gap: 15px;

            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }

        .item-name {
            font-weight: bold;
        }

        .item-details {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .item-price {
            font-weight: bold;
            white-space: nowrap;
        }

        /* =========================
           TOTAL
        ========================= */

        .order-total {
            text-align: right;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty-orders {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.08);
        }

        .empty-orders h2 {
            margin-top: 0;
        }

        .shop-button {
            display: inline-block;

            margin-top: 15px;

            padding: 12px 20px;

            background: #0d6efd;
            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-weight: bold;
        }

        .shop-button:hover {
            background: #0b5ed7;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                justify-content: center;
            }

            .order-card {
                padding: 15px;
            }

            .order-item {
                flex-direction: column;
                gap: 5px;
            }

            .item-price {
                text-align: left;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<header>

    <nav class="navbar">

        <div class="logo">
            🛒 MakeniMart
        </div>


        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart
                </a>
            </li>

            <li id="ordersNav">
                <a href="orders.html">
                    My Orders
                </a>
            </li>

            <!-- LOGIN -->

            <li id="loginNav">
                <a href="customer-login.html">
                    Login
                </a>
            </li>

            <!-- CREATE ACCOUNT -->

            <li id="registerNav">
                <a href="customer-register.html">
                    Create Account
                </a>
            </li>

            <!-- MY ACCOUNT -->

            <li
                id="accountNav"
                style="display:none;"
            >
                <a href="customer-account.html">
                    My Account
                </a>
            </li>

            <!-- LOGOUT -->

            <li
                id="logoutNav"
                style="display:none;"
            >
                <a
                    href="#"
                    id="logoutLink"
                >
                    Logout
                </a>
            </li>

        </ul>

    </nav>

</header>


<!-- =========================
     MAIN
========================= -->

<main>

    <h1>
        My Orders
    </h1>

    <p class="subtitle">

        View your MakeniMart orders
        and their current status.

    </p>


    <div id="message"></div>


    <div id="ordersContainer">

        <div class="loading">

            Loading your orders...

        </div>

    </div>

</main>


<script>

/* =====================================
   API
===================================== */

const API_BASE_URL =
    "http://localhost:5000/api";


/* =====================================
   ELEMENTS
===================================== */

const ordersContainer =
    document.getElementById(
        "ordersContainer"
    );

const message =
    document.getElementById(
        "message"
    );


/* =====================================
   NAVIGATION ELEMENTS
===================================== */

const loginNav =
    document.getElementById(
        "loginNav"
    );

const registerNav =
    document.getElementById(
        "registerNav"
    );

const accountNav =
    document.getElementById(
        "accountNav"
    );

const logoutNav =
    document.getElementById(
        "logoutNav"
    );

const logoutLink =
    document.getElementById(
        "logoutLink"
    );


/* =====================================
   UPDATE CUSTOMER NAVIGATION
===================================== */

function updateNavigation() {

    const loggedIn =
        localStorage.getItem(
            "makeniMartCustomerLoggedIn"
        ) === "true";


    if (loggedIn) {

        /* Customer logged in */

        loginNav.style.display =
            "none";

        registerNav.style.display =
            "none";

        accountNav.style.display =
            "inline-block";

        logoutNav.style.display =
            "inline-block";

    } else {

        /* Customer logged out */

        loginNav.style.display =
            "inline-block";

        registerNav.style.display =
            "inline-block";

        accountNav.style.display =
            "none";

        logoutNav.style.display =
            "none";

    }

}


/* =====================================
   LOGOUT
===================================== */

logoutLink.addEventListener(
    "click",
    function(event) {

        event.preventDefault();


        localStorage.removeItem(
            "makeniMartCustomerLoggedIn"
        );

        localStorage.removeItem(
            "makeniMartCustomer"
        );


        window.location.href =
            "customer-login.html";

    }
);


/* =====================================
   GET CUSTOMER
===================================== */

function getCustomer() {

    const customerData =
        localStorage.getItem(
            "makeniMartCustomer"
        );


    if (!customerData) {

        return null;

    }


    try {

        return JSON.parse(
            customerData
        );

    } catch (error) {

        console.error(
            "CUSTOMER DATA ERROR:",
            error
        );

        return null;

    }

}


/* =====================================
   FORMAT MONEY
===================================== */

function formatMoney(amount) {

    const value =
        Number(amount) || 0;


    return "Le " +
        value.toLocaleString(
            "en-SL",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(date) {

    if (!date) {

        return "Unknown date";

    }


    const parsedDate =
        new Date(date);


    if (
        Number.isNaN(
            parsedDate.getTime()
        )
    ) {

        return date;

    }


    return parsedDate.toLocaleString(
        "en-SL",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}


/* =====================================
   LOAD ORDERS
===================================== */

async function loadOrders() {

    const customer =
        getCustomer();


    /* =================================
       CHECK LOGIN
    ================================= */

    if (!customer) {

        ordersContainer.innerHTML = `

            <div class="empty-orders">

                <h2>
                    Please Login First
                </h2>

                <p>
                    You need to login to view
                    your orders.
                </p>

                <a
                    href="customer-login.html"
                    class="shop-button"
                >
                    Login
                </a>

            </div>

        `;

        return;

    }


    try {

        console.log(
            "Loading MakeniMart orders..."
        );


        const response =
            await fetch(
                `${API_BASE_URL}/orders`
            );


        const data =
            await response.json();


        console.log(
            "Orders response:",
            data
        );


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Could not load orders."
            );

        }


        const allOrders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        /* =================================
           FILTER CUSTOMER ORDERS
        ================================= */

        const customerOrders =
            allOrders.filter(
                function(order) {

                    const samePhone =
                        customer.phone &&
                        order.phone &&
                        String(
                            customer.phone
                        ).trim() ===
                        String(
                            order.phone
                        ).trim();


                    const sameEmail =
                        customer.email &&
                        order.email &&
                        String(
                            customer.email
                        )
                        .trim()
                        .toLowerCase() ===
                        String(
                            order.email
                        )
                        .trim()
                        .toLowerCase();


                    const sameName =
                        customer.fullName &&
                        order.customer_name &&
                        String(
                            customer.fullName
                        )
                        .trim()
                        .toLowerCase() ===
                        String(
                            order.customer_name
                        )
                        .trim()
                        .toLowerCase();


                    return (
                        samePhone ||
                        sameEmail ||
                        sameName
                    );

                }
            );


        console.log(
            "Customer orders:",
            customerOrders
        );


        /* =================================
           NO ORDERS
        ================================= */

        if (
            customerOrders.length === 0
        ) {

            ordersContainer.innerHTML = `

                <div class="empty-orders">

                    <h2>
                        No Orders Yet
                    </h2>

                    <p>
                        You have not placed
                        any orders yet.
                    </p>

                    <a
                        href="products.html"
                        class="shop-button"
                    >
                        Start Shopping
                    </a>

                </div>

            `;

            return;

        }


        /* =================================
           DISPLAY ORDERS
        ================================= */

        ordersContainer.innerHTML =
            customerOrders
                .map(
                    function(order) {

                        return createOrderHTML(
                            order
                        );

                    }
                )
                .join("");


    } catch (error) {

        console.error(
            "LOAD ORDERS ERROR:",
            error
        );


        ordersContainer.innerHTML = `

            <div class="empty-orders">

                <h2>
                    Could Not Load Orders
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

                <button
                    class="shop-button"
                    onclick="loadOrders()"
                >
                    Try Again
                </button>

            </div>

        `;

    }

}


/* =====================================
   CREATE ORDER HTML
===================================== */

function createOrderHTML(order) {

    const status =
        order.status ||
        "Pending";


    const items =
        Array.isArray(order.items)
            ? order.items
            : [];


    const itemsHTML =
        items.length > 0

        ? items.map(
            function(item) {

                const quantity =
                    Number(
                        item.quantity
                    ) || 0;


                const price =
                    Number(
                        item.price
                    ) || 0;


                const subtotal =
                    quantity * price;


                return `

                    <div class="order-item">

                        <div>

                            <div class="item-name">

                                ${escapeHTML(
                                    item.product_name ||
                                    "Product"
                                )}

                            </div>


                            <div class="item-details">

                                Quantity:
                                ${quantity}

                                ×

                                ${formatMoney(
                                    price
                                )}

                            </div>

                        </div>


                        <div class="item-price">

                            ${formatMoney(
                                subtotal
                            )}

                        </div>

                    </div>

                `;

            }
        ).join("")

        : `

            <p>
                No item details available.
            </p>

        `;


    return `

        <div class="order-card">

            <div class="order-header">

                <div class="order-number">

                    Order #${order.id}

                </div>


                <div
                    class="status ${escapeHTML(
                        status
                    )}"
                >

                    ${escapeHTML(
                        status
                    )}

                </div>

            </div>


            <div class="order-info">

                <div class="info-box">

                    <div class="info-label">
                        Order Date
                    </div>

                    <div class="info-value">

                        ${formatDate(
                            order.created_at
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Delivery Location
                    </div>

                    <div class="info-value">

                        ${escapeHTML(
                            order.delivery_location ||
                            order.address ||
                            "Not provided"
                        )}

                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        Payment Method
                    </div>

                    <div class="info-value">

                        ${escapeHTML(
                            order.payment_method ||
                            "Not provided"
                        )}

                    </div>

                </div>

            </div>


            <div class="items-title">

                Ordered Products

            </div>


            ${itemsHTML}


            <div class="order-total">

                Total:
                ${formatMoney(
                    order.total
                )}

            </div>

        </div>

    `;

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value ?? "");


    return div.innerHTML;

}


/* =====================================
   START PAGE
===================================== */

updateNavigation();

loadOrders();

</script>


</body>

</html>
